name: CI Build

on:
  push:
    branches:
      - dev
      - 'feat/**'
  pull_request:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM GCC Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi ninja-build ccache cppcheck

      # 编译只要有一个配置过就算过, 但 cppcheck 不干净一律拒绝合并
      - name: Build and check all configurations
        shell: bash
        run: .github/scripts/check_all.sh

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/**/cppcheck/cppcheck.log
            build/**/logs
          if-no-files-found: ignore
